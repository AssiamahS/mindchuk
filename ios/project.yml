name: MindChuk
options:
  bundleIdPrefix: com.assiamah
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: QGMAWHX827
    CODE_SIGN_STYLE: Automatic

targets:
  MindChuk:
    type: application
    platform: iOS
    sources:
      - MindChuk
    info:
      path: MindChuk/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: MindChuk
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: MindChuk attaches photos you pick to your notes. Photos stay on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.mindchuk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

schemes:
  MindChuk:
    build:
      targets:
        MindChuk: all
    run:
      config: Debug
