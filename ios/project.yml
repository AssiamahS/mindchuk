name: MindChuk
options:
  bundleIdPrefix: com.assiamah
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: QGMAWHX827
    CODE_SIGN_STYLE: Automatic

targets:
  MindChuk:
    type: application
    platform: iOS
    sources:
      - MindChuk
      - Shared
    dependencies:
      - target: MindChukWidgets
    entitlements:
      path: MindChuk/MindChuk.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.assiamah.mindchuk
    info:
      path: MindChuk/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: MindChuk
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: MindChuk attaches photos you pick to your notes. Photos stay on this device.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.mindchuk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

  MindChukWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MindChukWidgets
      - Shared
    entitlements:
      path: MindChukWidgets/MindChukWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.assiamah.mindchuk
    info:
      path: MindChukWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: MindChuk
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.mindchuk.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

schemes:
  MindChuk:
    build:
      targets:
        MindChuk: all
    run:
      config: Debug
